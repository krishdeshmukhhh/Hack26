[project]
name = "curio"
version = "0.1.0"
description = "Curio — voice tutor for Windows learners."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.7",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "mss>=9.0",
    "pynput>=1.7.6",
    "httpx>=0.27",
    "websockets>=12.0",
    "pillow>=10.0",
    "platformdirs>=4.0",
    "qasync>=0.27",
    "pycaw>=20251023",
    "comtypes>=1.4.16",
]

[project.optional-dependencies]
# backend = "local": on-device speech-to-text. Install with `uv sync --extra local`.
local = [
    "faster-whisper>=1.1",
    "kokoro-onnx>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyinstaller>=6.0",
]

[project.scripts]
curio = "curio.__main__:main"
curio-map-server = "curio.map_sync.server:main"
curio-map-seed = "curio.map_sync.seed:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"curio/prompts.py" = ["E501"]  # prompt strings are naturally long

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curio"]
