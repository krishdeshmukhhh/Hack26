# Curio configuration
# Edit this file to point Curio at your own Cloudflare Worker deployment,
# or set backend = "local" to run without any API keys.

# "cloud": Claude + AssemblyAI + ElevenLabs through your Cloudflare Worker.
# "local": your own OpenAI-compatible model server (for example vLLM),
#          Whisper on this PC, and the built-in Windows voices. See [local].
backend = "cloud"

# Your deployed Cloudflare Worker URL. Deploy the worker/ folder via
# `wrangler deploy` and paste the resulting URL here. See README.md.
worker_url = "https://curio-proxy.your-subdomain.workers.dev"

# Push-to-talk binding. Options: "ctrl+alt" (default), "right_ctrl"
# (useful for international keyboards where Ctrl+Alt conflicts with AltGr).
hotkey = "ctrl+alt"

# Default Claude model. Options: "claude-sonnet-4-6" (fast, cheap),
# "claude-opus-4-6" (slower, smarter). Switchable at runtime via the
# model picker in the panel.
default_model = "claude-sonnet-4-6"

# Log verbosity. Options: "DEBUG", "INFO", "WARNING", "ERROR".
log_level = "INFO"

# Path to knowledge base folder. Each subfolder = one app's KB.
# Default: %APPDATA%/Curio/knowledge/
# knowledge_dir = "C:/path/to/knowledge"

# Settings used only when backend = "local". worker_url is ignored then.
[local]
# OpenAI-compatible endpoint. With the SSH tunnel from server/README.md
# running, the cluster's vLLM server appears at localhost:8000.
llm_base_url = "http://localhost:8000/v1"
# Must match the model name vLLM is serving.
llm_model = "Qwen/Qwen3-VL-32B-Instruct"
# Must match vLLM's --api-key. Set one on a shared cluster.
llm_api_key = ""
# Coordinate format the model uses for pointing. "norm1000" for Qwen3-VL,
# "pixel" for Qwen2.5-VL and most other models.
point_coords = "norm1000"
# faster-whisper model: "base.en" (~1 s per question on a laptop CPU),
# "small.en" (more accurate but 2-5 s on CPU; fine with whisper_device =
# "cuda"), "large-v3" (best, needs "cuda").
whisper_model = "base.en"
# "cpu" works everywhere. "cuda" needs the CUDA 12 cuBLAS/cuDNN DLLs on PATH.
whisper_device = "cpu"
# Voice engine: "kokoro" (natural neural voice, runs on this PC; ~350 MB
# model downloaded on first run) or "system" (built-in Windows voices).
# If Kokoro can't load, Curio falls back to the Windows voice.
tts_engine = "kokoro"
# kokoro: a voice id such as "af_heart" (default), "af_bella", "am_michael",
#         "bf_emma" (af/am = US female/male, bf/bm = UK).
# system: part of a Windows voice name, such as "Zira". Empty = default.
tts_voice = ""

# Animated cursor companion. Tray menu > Pet changes species immediately and saves it.
[pet]
species = "fox"                 # fox, cat, red-panda, ferret
profile = "auto"                # auto, playful, reserved, relaxed, energetic
reduced_motion = false
playful_idle = true
jump_frequency = 1.0            # 0 disables jumps; multiplier from 0 to 5
jump_height = 0.0               # 0-64 logical pixels; only clips allowing added arcs
jump_speed = 1.0                # playback multiplier, 0.25-4
sleep_after_seconds = 45       # inactivity threshold, 10-3600 seconds

[memory]
enabled = false
storage_mode = "local"           # local or session
automatic_learning = "off"       # off or propose; approval always required
# storage_path = "C:/Users/you/AppData/Local/Curio/memory.sqlite3"
# default_expiration_days = 90

# Walkthroughs teach Curio: each guided task is logged on this PC, finished
# ones become verified paths, and a per-concept skill model decides how much
# help to give next time. Nothing leaves the device unless sharing is on.
[learning]
enabled = true
# Tray menu > "Share walkthroughs anonymously" changes this and saves it.
# Shared: app name, your question (normalised), step instructions and element
# positions. Never shared: window titles, file names, screenshots or audio.
share_walkthroughs = false
# Map server that shared paths are pushed to and pulled from. Empty = no sync.
sync_url = ""
