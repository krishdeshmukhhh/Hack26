[[steps]]
title = "Open MATLAB and create a new script named lab3.m"

[[steps]]
title = "Load lab3_data.csv into a table with readtable"

[[steps]]
title = "Make vectors t and v from the table's time and velocity columns"

[[steps]]
title = "Plot v against t with plot(t, v)"

[[steps]]
title = "Add a title, axis labels with units, and a grid"

[[steps]]
